<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Python Kodları - mühendisdiyebirii</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root{--bg-light:#fafbfe;--bg-accent-light:#ffffff;--surface-light:#ffffff;--text-light:#0b1020;--muted-light:#5b6478;--border-light:#e6e9f2;--link-light:#6d28d9;--gold-light:#c89b3c;--shadow-light:0 10px 30px rgba(24,38,80,.08);--bg-dark:#0b1020;--bg-accent-dark:#1a1f2e;--surface-dark:#1a1f2e;--text-dark:#fafbfe;--muted-dark:#a0a4b8;--border-dark:#2a2f3e;--link-dark:#8b5cf6;--gold-dark:#f59e0b;--shadow-dark:0 10px 30px rgba(0,0,0,.3)}
        [data-theme="dark"]{--bg:var(--bg-dark);--bg-accent:var(--bg-accent-dark);--surface:var(--surface-dark);--text:var(--text-dark);--muted:var(--muted-dark);--border:var(--border-dark);--link:var(--link-dark);--gold:var(--gold-dark);--shadow:var(--shadow-dark)}
        [data-theme="light"]{--bg:var(--bg-light);--bg-accent:var(--bg-accent-light);--surface:var(--surface-light);--text:var(--text-light);--muted:var(--muted-light);--border:var(--border-light);--link:var(--link-light);--gold:var(--gold-light);--shadow:var(--shadow-light)}
        *{box-sizing:border-box}html,body{margin:0;padding:0}
        body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg) 0%,var(--bg-accent) 100%);color:var(--text);line-height:1.65}
        .container{width:min(1000px,92%);margin:0 auto}
        nav{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
        .nav-inner{display:flex;justify-content:center;gap:18px;align-items:center;padding:14px 0}
        nav a{color:var(--text);text-decoration:none;padding:8px 10px;border-radius:8px;position:relative;transition:color .2s}
        nav a::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:2px;background:linear-gradient(90deg,var(--link),var(--gold));border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .25s}
        nav a:hover{color:var(--link)}nav a:hover::after{transform:scaleX(1)}
        header{text-align:center;padding:48px 0 28px}
        header h1{margin:0 0 10px;font-size:clamp(1.6rem,3vw,2.2rem);background:linear-gradient(90deg,var(--text),var(--link));-webkit-background-clip:text;background-clip:text;color:transparent}
        header p{margin:0 auto;max-width:720px;color:var(--muted)}
        section{padding:24px 0;text-align:center}
        .btn{display:inline-block;padding:12px 18px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);text-decoration:none;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow);margin:8px}
        .btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(24,38,80,.12)}
        .btn.primary{background:linear-gradient(135deg,var(--link),#c084fc);border-color:transparent;color:#fff}
        footer{border-top:1px solid var(--border);color:var(--muted);font-size:.95rem;padding:20px 0;margin:24px 0 0;text-align:center;background:var(--surface)}
        a:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    </style>
</head>
<body>

        <div class="container nav-inner">

            <a href="htmlkodları.html">HTML Notları</a>

    <header>

            <h1>🐍 Python Kodları</h1>
            <p>Python ile hazırladığım örnek kodları ve projeleri burada bulabilirsiniz.</p>
        </div>
    </header>
    <main class="container">
        <section>
            <a class="btn primary" href="Python ile kalp yapma.html">Python ile Kalp Yapma</a>

            <a class="btn primary" href="Sınırsız Mesaj Atma.html">Sınırsız Mesaj Atma</a>
        </section>
    </main>
    <footer>&copy; 2025 Mehmet Karadaş. Tüm hakları saklıdır.</footer>

</body>
</html>
